<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Práctica de lectura y escritura de notas</title>
<style>
:root{--azul:#2457c5;--azul2:#163b91;--verde:#16733a;--rojo:#b42318;--tinta:#171717;--fondo:#eef2f7;--tarjeta:#fff;--borde:#c8ced8}
*{box-sizing:border-box}body{margin:0;background:var(--fondo);color:var(--tinta);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.app{width:min(980px,100%);margin:auto;padding:18px}.card{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:clamp(16px,4vw,30px);box-shadow:0 6px 24px #17203318}h1{text-align:center;font-size:clamp(1.45rem,4vw,2rem);margin:0 0 8px}p.sub{text-align:center;color:#4f5968;margin:0 0 22px}.config{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:680px;margin:0 auto}.group{border:1px solid var(--borde);border-radius:12px;padding:14px}.group legend{font-weight:750;padding:0 6px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{position:relative}.choice input{position:absolute;opacity:0}.choice label{display:block;border:2px solid var(--borde);border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:650}.choice input:checked+label{border-color:var(--azul);background:#e8efff;color:var(--azul2)}button,select{font:inherit;border-radius:9px;padding:10px 16px}.primary{background:var(--azul);color:#fff;border:1px solid var(--azul);font-weight:750;cursor:pointer}.primary:hover{background:var(--azul2)}.secondary{background:#fff;color:var(--tinta);border:1px solid #8a93a3;cursor:pointer}.start{display:block;margin:22px auto 0;min-width:190px}.hidden{display:none!important}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px;color:#4f5968;font-weight:650}.progress{height:9px;background:#dfe4ec;border-radius:999px;overflow:hidden;margin-bottom:14px}.bar{height:100%;width:0;background:var(--azul);transition:width .2s}.prompt{text-align:center;font-size:clamp(1.2rem,4vw,1.65rem);font-weight:800;min-height:2em;margin:8px 0}.staff-wrap{background:#fff;border:1px solid var(--borde);border-radius:12px;overflow:hidden}.staff-wrap.write{cursor:crosshair}.staff-wrap canvas{display:block;width:100%;height:auto;touch-action:manipulation}.controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}select{border:1px solid #7d8798;background:#fff;min-width:150px}.feedback{text-align:center;font-weight:800;min-height:1.55em;margin:12px 0 0}.ok{color:var(--verde)}.bad{color:var(--rojo)}.hint{text-align:center;color:#596273;font-size:.92rem;margin:8px 0 0}.results{text-align:center}.percentage{font-size:clamp(3rem,12vw,5.5rem);line-height:1;font-weight:900;color:var(--azul);margin:14px 0 4px}.fraction{font-size:1.25rem;font-weight:750}.result-msg{margin:8px 0 22px}.errors{max-width:650px;margin:20px auto;text-align:left;border-top:1px solid var(--borde);padding-top:16px}.errors h3{margin:0 0 8px}.errors li{margin:7px 0}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}:focus-visible{outline:3px solid #f2a900;outline-offset:3px}
@media(max-width:600px){.config{grid-template-columns:1fr}.app{padding:8px}.card{border-radius:10px}.topbar{font-size:.9rem}}
</style>
</head>
<body><main class="app"><section class="card">
<div id="setup">
<h1>Práctica de notas en clave de sol</h1><p class="sub">Desde el DO central hasta el DO con dos líneas adicionales superiores.</p>
<div class="config">
<fieldset class="group"><legend>Actividad</legend><div class="choices">
<div class="choice"><input id="mRead" name="mode" type="radio" value="read" checked><label for="mRead">Adivinar notas</label></div>
<div class="choice"><input id="mWrite" name="mode" type="radio" value="write"><label for="mWrite">Escribir notas</label></div>
</div></fieldset>
<fieldset class="group"><legend>Número de preguntas</legend><div class="choices">
<div class="choice"><input id="q5" name="count" type="radio" value="5" checked><label for="q5">5 preguntas</label></div>
<div class="choice"><input id="q10" name="count" type="radio" value="10"><label for="q10">10 preguntas</label></div>
</div></fieldset>
</div><button id="start" class="primary start" type="button">Comenzar</button>
</div>

<div id="quiz" class="hidden">
<div class="topbar"><span id="modeLabel"></span><span id="counter"></span></div><div class="progress"><div id="bar" class="bar"></div></div>
<div id="prompt" class="prompt"></div>
<div id="staffWrap" class="staff-wrap"><canvas id="staff" width="900" height="360" aria-label="Pentagrama en clave de sol"></canvas></div>
<div id="readControls" class="controls"><label for="answer">Nombre:</label><select id="answer"><option value="">Elige…</option><option>DO</option><option>RE</option><option>MI</option><option>FA</option><option>SOL</option><option>LA</option><option>SI</option></select><button id="checkRead" class="primary" type="button">Comprobar</button></div>
<div id="writeControls" class="controls hidden"><button id="checkWrite" class="primary" type="button">Comprobar</button></div>
<div id="feedback" class="feedback" aria-live="polite"></div><p id="hint" class="hint"></p>
</div>

<div id="results" class="results hidden">
<h1>Resultado final</h1><div id="percentage" class="percentage"></div><div id="fraction" class="fraction"></div><p id="resultMsg" class="result-msg"></p>
<div id="errors" class="errors"></div><div class="actions"><button id="again" class="primary" type="button">Repetir</button><button id="change" class="secondary" type="button">Cambiar actividad</button></div>
</div>
</section></main>

const names=['DO','RE','MI','FA','SOL','LA','SI'];
// 15 posiciones diatónicas: DO central a DO superior.
const pos=Array.from({length:15},(_,i)=>({step:i,name:names[i%7],y:275-i*16}));
const C=document.getElementById('staff'),ctx=C.getContext('2d'),img=new Image();img.src=CLEF;
let mode='read',total=5,index=0,score=0,current=null,selected=null,errors=[],locked=false,lastStep=-1;
const $=id=>document.getElementById(id);
function line(y,x1=170,x2=850){ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke()}
function drawBase(){ctx.clearRect(0,0,C.width,C.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,C.width,C.height);ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.lineCap='round';[243,211,179,147,115].forEach(y=>line(y));if(img.complete)ctx.drawImage(img,55,26,105,300)}
function ledger(step,x=555){ctx.strokeStyle='#111';ctx.lineWidth=3;if(step===0)line(275,x-34,x+34);if(step>=12)line(83,x-34,x+34);if(step===14)line(51,x-34,x+34)}
function note(p){ledger(p.step);ctx.save();ctx.translate(555,p.y);ctx.rotate(-.18);ctx.beginPath();ctx.ellipse(0,0,23,15,0,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=5;ctx.stroke();ctx.restore()}
function render(){drawBase();if(mode==='read'||selected)note(mode==='read'?current:selected)}
img.onload=render;
function pickPosition(){let p;do{p=pos[Math.floor(Math.random()*pos.length)]}while(p.step===lastStep);lastStep=p.step;return p}
function newQuestion(){locked=false;selected=null;$('feedback').textContent='';$('feedback').className='feedback';$('answer').value='';current=mode==='read'?pickPosition():{name:names[Math.floor(Math.random()*7)]};$('counter').textContent=`Pregunta ${index+1} de ${total}`;$('bar').style.width=`${index/total*100}%`;$('prompt').textContent=mode==='read'?'¿Qué nota es?':`Escribe un ${current.name}`;$('hint').textContent=mode==='read'?'Selecciona el nombre y pulsa Intro o Comprobar.':'Pulsa una línea o un espacio. Después, pulsa Intro o Comprobar.';render();if(mode==='read')$('answer').focus();else C.focus()}
function begin(){mode=document.querySelector('input[name=mode]:checked').value;total=Number(document.querySelector('input[name=count]:checked').value);index=score=0;errors=[];lastStep=-1;$('setup').classList.add('hidden');$('results').classList.add('hidden');$('quiz').classList.remove('hidden');$('readControls').classList.toggle('hidden',mode!=='read');$('writeControls').classList.toggle('hidden',mode!=='write');$('staffWrap').classList.toggle('write',mode==='write');$('modeLabel').textContent=mode==='read'?'Adivinar notas':'Escribir notas';newQuestion()}
function finish(correct,detail){if(locked)return;locked=true;if(correct){score++;$('feedback').textContent='Correcto';$('feedback').className='feedback ok'}else{$('feedback').textContent=detail;$('feedback').className='feedback bad';errors.push({n:index+1,detail})}index++;$('bar').style.width=`${index/total*100}%`;setTimeout(index<total?newQuestion:showResults,850)}
function checkRead(){if(locked)return;const a=$('answer').value;if(!a){$('feedback').textContent='Elige una nota.';$('feedback').className='feedback bad';return}finish(a===current.name,`Incorrecto: era ${current.name}.`)}
function checkWrite(){if(locked)return;if(!selected){$('feedback').textContent='Primero coloca la nota.';$('feedback').className='feedback bad';return}finish(selected.name===current.name,`Incorrecto: has escrito ${selected.name}; se pedía ${current.name}.`)}
function showResults(){$('quiz').classList.add('hidden');$('results').classList.remove('hidden');const pct=Math.round(score/total*100);$('percentage').textContent=pct+' %';$('fraction').textContent=`${score} de ${total} correctas`;$('resultMsg').textContent=pct===100?'Excelente: todas correctas.':pct>=80?'Muy buen resultado.':pct>=60?'Buen comienzo; conviene repasar los errores.':'Conviene repetir la actividad y revisar las posiciones.';$('errors').innerHTML=errors.length?'<h3>Preguntas falladas</h3><ol>'+errors.map(e=>`<li value="${e.n}">${e.detail}</li>`).join('')+'</ol>':'<h3>Sin errores</h3><p>Has acertado todas las preguntas.</p>'}
function canvasPoint(ev){const r=C.getBoundingClientRect();return{x:(ev.clientX-r.left)*C.width/r.width,y:(ev.clientY-r.top)*C.height/r.height}}
C.addEventListener('click',ev=>{if(mode!=='write'||locked)return;const p=canvasPoint(ev);if(p.x<165||p.x>860||p.y<35||p.y>292)return;selected=pos.reduce((a,b)=>Math.abs(b.y-p.y)<Math.abs(a.y-p.y)?b:a);$('feedback').textContent='Nota colocada. Pulsa Intro o Comprobar.';$('feedback').className='feedback';render()});
$('start').addEventListener('click',begin);$('checkRead').addEventListener('click',checkRead);$('checkWrite').addEventListener('click',checkWrite);$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();checkRead()}});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('quiz').classList.contains('hidden')&&mode==='write'){e.preventDefault();checkWrite()}});$('again').addEventListener('click',begin);$('change').addEventListener('click',()=>{$('results').classList.add('hidden');$('setup').classList.remove('hidden')});
})();
